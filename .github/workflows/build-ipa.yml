name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configure Xcode
        run: |
          LS=$(ls /Applications | grep -i "Xcode" | head -1)
          echo "Using Xcode: $LS"
          sudo xcode-select -s "/Applications/$LS"
          xcodebuild -version

      - name: Build archive (no code signing)
        run: |
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath build/Arnold.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package IPA
        run: |
          APP=$(ls -d build/Arnold.xcarchive/Products/Applications/*.app | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r "Arnold.ipa" Payload/
          ls -la Arnold.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arnold-ipa
          path: Arnold.ipa
          if-no-files-found: error
